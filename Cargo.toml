[package]
name = "rust-axum-image-bbs"
version = "0.1.0"
edition = "2021"
description = "旧PHP画像掲示板を Rust + axum で再実装する学習用プロジェクト"

[dependencies]
# axum 本体（HTTP ルーティング・ハンドラ・抽出器を提供する Web フレームワーク）
#   features = ["multipart"] で、ファイル付きフォーム（multipart/form-data）を読む `Multipart` 抽出器が使える。
axum = { version = "0.7", features = ["multipart"] }
# tokio：axum が依存する非同期ランタイム。"full" は学習用に主要機能を一括有効化
tokio = { version = "1", features = ["full"] }
# tracing：Rust 標準的な構造化ログ・トレーシングファサード。
#   println! より情報量が多く、ログレベル（debug/info/warn/error）・スパン・フィールドを扱える。
#   本番環境でのログ集約・フィルタリングを見越して最初から導入する。
tracing = "0.1"
# tracing-subscriber：tracing イベントを実際に出力する「subscriber」の実装集。
#   features = ["env-filter"] を有効にすると RUST_LOG 環境変数でレベルを動的に切り替えられる。
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# tower-http：Tower ミドルウェアの HTTP 特化実装集。
#   features = ["trace"] で TraceLayer が使えるようになり、
#   axum の Router に .layer() で差し込むだけでリクエスト/レスポンスを自動ログ出力できる。
#   features = ["fs"] で ServeDir が使えるようになり、アップロード画像のディレクトリをそのまま配信できる。
tower-http = { version = "0.5", features = ["trace", "fs"] }
# sqlx：Rust 向けの非同期対応 SQL クライアントライブラリ。
#   マクロを使えばクエリをコンパイル時に検証できる（今回は実行時クエリとして使用）。
#   有効にする features の意味:
#     runtime-tokio  … 非同期ランタイムに tokio を使う（axum と同じランタイムを共有）
#     sqlite         … SQLite ドライバを有効化（他に postgres / mysql なども選べる）
#     macros         … query!() / query_as!() などのコンパイル時検証マクロを使えるようにする
#     migrate        … sqlx::migrate!() マクロと MigrateDatabase trait を有効化する
#     chrono         … SQLite の TEXT 日時を Rust の chrono::DateTime 型へ自動変換する
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
# chrono：Rust の日付・時刻を扱う標準的なライブラリ。
#   sqlx の chrono feature と組み合わせることで、DB から取得した日時文字列を
#   NaiveDateTime や DateTime<Utc> 型として受け取れるようになる。
#   features = ["serde"] を有効にすると、JSON シリアライズ/デシリアライズも可能になる。
chrono = { version = "0.4", features = ["serde"] }

# dotenvy：ローカル開発用の .env を起動時に読み込む。
dotenvy = "0.15"
# askama：Jinja 風の HTML テンプレートを「コンパイル時に」Rust コードへ変換するテンプレートエンジン。
#   テンプレートの構文ミスや存在しない変数の参照は cargo build の時点でエラーになる。
#   拡張子 .html のテンプレートは自動で HTML エスケープされる（XSS 対策）。
askama = "0.12"
# askama_axum：Askama のテンプレート構造体に axum の IntoResponse を実装させる連携クレート。
#   これを入れると、ハンドラはテンプレート構造体をそのまま return するだけで HTML を返せる。
askama_axum = "0.4"
# serde：Rust の構造体と外部データ（クエリ文字列・JSON など）を相互変換する定番クレート。
#   features = ["derive"] で `#[derive(Deserialize)]` が使えるようになり、
#   axum の `Query<T>` が `?page=2` を構造体 T に変換するときに使われる。
serde = { version = "1", features = ["derive"] }
# infer：ファイル先頭のバイト列（マジックナンバー）から形式を判定するクレート。
#   PNG なら必ず `89 50 4E 47`、JPEG なら `FF D8 FF` で始まる、という決まりを使う。
#   クライアントが申告するファイル名や Content-Type は簡単に偽装できるので、画像形式はこれで判定する（NFR-102）。
infer = "0.16"

# dev-dependencies はテスト（cargo test）のときだけ使うクレート。本番バイナリには含まれない。
[dev-dependencies]
# tower：`ServiceExt::oneshot` で、サーバを listen せずにルーターへ直接リクエストを1回投げるために使う。
#   axum 0.7.9 自身が依存している tower 0.5 に揃えて、同じクレートを二重にビルドしないようにする。
tower = { version = "0.5", features = ["util"] }
# tempfile：テストごとに使い捨ての一時ディレクトリ（UPLOAD_DIR 用）を作る。drop 時に自動で削除される。
tempfile = "3"

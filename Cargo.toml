[package]
name = "rust-axum-image-bbs"
version = "0.1.0"
edition = "2021"
description = "旧PHP画像掲示板を Rust + axum で再実装する学習用プロジェクト"

[dependencies]
# axum 本体（HTTP ルーティング・ハンドラ・抽出器を提供する Web フレームワーク）
axum = "0.7"
# tokio：axum が依存する非同期ランタイム。"full" は学習用に主要機能を一括有効化
tokio = { version = "1", features = ["full"] }
# tracing：Rust 標準的な構造化ログ・トレーシングファサード。
#   println! より情報量が多く、ログレベル（debug/info/warn/error）・スパン・フィールドを扱える。
#   本番環境でのログ集約・フィルタリングを見越して最初から導入する。
tracing = "0.1"
# tracing-subscriber：tracing イベントを実際に出力する「subscriber」の実装集。
#   features = ["env-filter"] を有効にすると RUST_LOG 環境変数でレベルを動的に切り替えられる。
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# tower-http：Tower ミドルウェアの HTTP 特化実装集。
#   features = ["trace"] で TraceLayer が使えるようになり、
#   axum の Router に .layer() で差し込むだけでリクエスト/レスポンスを自動ログ出力できる。
tower-http = { version = "0.5", features = ["trace"] }
# sqlx：Rust 向けの非同期対応 SQL クライアントライブラリ。
#   マクロを使えばクエリをコンパイル時に検証できる（今回は実行時クエリとして使用）。
#   有効にする features の意味:
#     runtime-tokio  … 非同期ランタイムに tokio を使う（axum と同じランタイムを共有）
#     sqlite         … SQLite ドライバを有効化（他に postgres / mysql なども選べる）
#     macros         … query!() / query_as!() などのコンパイル時検証マクロを使えるようにする
#     migrate        … sqlx::migrate!() マクロと MigrateDatabase trait を有効化する
#     chrono         … SQLite の TEXT 日時を Rust の chrono::DateTime 型へ自動変換する
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
# chrono：Rust の日付・時刻を扱う標準的なライブラリ。
#   sqlx の chrono feature と組み合わせることで、DB から取得した日時文字列を
#   NaiveDateTime や DateTime<Utc> 型として受け取れるようになる。
#   features = ["serde"] を有効にすると、JSON シリアライズ/デシリアライズも可能になる。
chrono = { version = "0.4", features = ["serde"] }
